  <!-- Trame de fourchette+couteau en filigrane (LS-refonte v3).
       v1 : forme dessinée à la main, couteau pas reconnaissable.
       v2 : bon tracé (Phosphor ForkKnife, graisse "thin") mais icônes trop
       petites (12-20px) — à l'échelle d'un écran de bureau réel et après
       compression d'une capture d'écran, elles se noyaient dans le bruit et
       devenaient invisibles malgré une opacité correcte (retour utilisateur,
       deux fois). v3 : même tracé fin, mais des icônes nettement plus
       grandes (24-38px) — le trait reste fin (c'est la nature du tracé
       "thin"), seule l'échelle grandit, donc ça reste discret de près tout
       en se voyant à distance normale. -->
